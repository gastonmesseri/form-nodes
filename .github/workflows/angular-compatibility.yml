name: Angular compatibility

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build shared package with Angular 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack the library
        run: |
          mkdir -p artifacts
          npm pack ./dist --pack-destination artifacts --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: form-nodes-package
          path: artifacts/*.tgz
          if-no-files-found: error

  consumer:
    name: Angular ${{ matrix.angular }} / Node ${{ matrix.node }} consumer
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - angular: '22'
            node: '22.22.3'
          - angular: '21'
            node: '22.22.3'
          - angular: '21'
            node: '20.19.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tests/compatibility/angular-${{ matrix.angular }}/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: form-nodes-package
          path: artifacts
      - name: Check packed consumer
        id: compatibility
        env:
          npm_config_engine_strict: true
        shell: bash
        run: |
          packages=(artifacts/*.tgz)
          test "${#packages[@]}" -eq 1
          node scripts/test-angular-compatibility.mjs '${{ matrix.angular }}' "${packages[0]}"
      - name: Report compatibility result
        if: always()
        env:
          NODE_VERSION: ${{ matrix.node }}
          ANGULAR_MAJOR: ${{ matrix.angular }}
          OUTCOME: ${{ steps.compatibility.outcome }}
        run: |
          echo "Angular ${ANGULAR_MAJOR} / Node ${NODE_VERSION}: ${OUTCOME}" >> "$GITHUB_STEP_SUMMARY"

  ui:
    name: Angular ${{ matrix.angular }} / ${{ matrix.browser }} real UI controls
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - angular: '21'
            browser: chromium
          - angular: '22'
            browser: chromium
          - angular: '21'
            browser: firefox
          - angular: '21'
            browser: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/compatibility/ui-angular-${{ matrix.angular }}/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:ui:compatibility -- ${{ matrix.angular }} ${{ matrix.browser }}
